<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adoni Jobs | ADONI CITY</title>
<meta name="description" content="Find job opportunities in Adoni, Andhra Pradesh.">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}
header {
  background: #102b52;
  color: white;
  padding: 25px;
  text-align: center;
}
nav {
  background: #174b83;
  padding: 14px;
  text-align: center;
}
nav a {
  color: white;
  text-decoration: none;
  margin: 12px;
}
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #bbb;
  border-radius: 10px;
  font-size: 16px;
}
.job {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}
.job h3 { margin-top: 0; }
.badge {
  display: inline-block;
  background: #dcecff;
  padding: 6px 10px;
  border-radius: 15px;
  font-size: 12px;
}
.empty {
  text-align: center;
  background: white;
  padding: 30px;
  border-radius: 12px;
  margin-top: 20px;
}
footer {
  background: #102b52;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
<h1>ADONI CITY</h1>
<p>Adoni Job Portal</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="business.html">Businesses</a>
<a href="jobs.html">Jobs</a>
</nav>

<div class="container">
<h2>Find Jobs in Adoni</h2>
<p>Discover local employment opportunities.</p>

<input type="search" class="search" id="search"
placeholder="Search job title or company...">

<div id="jobs">
  <div class="empty">
    <h2>💼</h2>
    <h3>Job Listings Coming Soon!</h3>
    <p>We are preparing job opportunities for Adoni residents.</p>
  </div>
</div>
</div>

<footer>
<h3>ADONI CITY ❤️</h3>
<p>Everything About Adoni</p>
<p>© 2026 ADONI CITY</p>
</footer>

<script>
const search = document.getElementById("search");

search.addEventListener("input", function() {
  const jobs = document.querySelectorAll(".job");
  let found = 0;

  jobs.forEach(job => {
    const match = job.innerText.toLowerCase()
      .includes(search.value.toLowerCase());

    job.style.display = match ? "" : "none";
    if (match) found++;
  });

  const empty = document.getElementById("no-results");
  if (empty) empty.style.display = found ? "none" : "block";
});
</script>

</body>
</html>
